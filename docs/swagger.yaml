      - 账号
  /user/logout:
    post:
      consumes:
      - application/json
      description: 登出
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Response'
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 登出
      tags:
      - 账号
  /user/preferences:
    get:
      consumes:
      - application/json
      description: 获取用户偏好设置
      produces:
      - application/json
      responses:
        "200":
          description: data.preferences 为 []*models.UserPreference
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 获取用户偏好设置
      tags:
      - 账号
    put:
      consumes:
      - application/json
      description: 更新用户偏好设置
      parameters:
      - description: 更新偏好设置请求
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: data.preferences 为 []*models.UserPreference
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 更新用户偏好设置
      tags:
      - 账号
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
