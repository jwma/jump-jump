      tags:
      - 超级管理员
  /super/tenants/{id}/status:
    patch:
      consumes:
      - application/json
      description: 超级管理员启用或禁用租户
      parameters:
      - description: 租户 ID
        in: path
        name: id
        required: true
        type: string
