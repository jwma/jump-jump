      - application/json
      description: 超级管理员查看所有用户，支持分页和搜索
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: pageSize
        type: integer
      - description: 搜索用户名
        in: query
        name: query
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
