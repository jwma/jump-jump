definitions:
  models.AddDomainRequest:
    properties:
      domain:
        type: string
      isDefault:
        type: boolean
    required:
    - domain
    type: object
  models.ChangePasswordAPIRequest:
    properties:
      newPassword:
        type: string
      password:
        type: string
    type: object
  models.CreateShortLinkAPIRequest:
    properties:
      description:
        type: string
      id:
        type: string
      idLength:
        type: integer
      isEnable:
        type: boolean
      url:
        type: string
    type: object
  models.CreateShortLinkAPIResponseData:
    properties:
      shortLink:
        $ref: '#/definitions/models.ShortLinkData'
    type: object
  models.CreateTenantRequest:
    properties:
      name:
        type: string
      slug:
        type: string
    required:
    - name
    - slug
    type: object
  models.DailyStats:
    properties:
      date:
        type: string
      pv:
        type: integer
      uv:
        type: integer
    type: object
  models.GetConfigAPIResponseData:
    properties:
      config: {}
    type: object
  models.GetShortLinkAPIResponseData:
    properties:
      shortLink:
        $ref: '#/definitions/models.ShortLinkData'
    type: object
  models.GetUserInfoAPIResponseData:
    properties:
      role:
        type: integer
      username:
        type: string
    type: object
  models.ListShortLinksAPIResponseData:
    properties:
      shortLinks:
        items:
          $ref: '#/definitions/models.ShortLinkData'
        type: array
      total:
        type: integer
    type: object
  models.LoginAPIRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  models.LoginAPIResponseData:
    properties:
      token:
        type: string
    type: object
  models.RequestHistory:
    properties:
      id:
        type: string
      ip:
        type: string
      os:
        type: string
      shortLinkId:
        type: string
      tenantId:
        type: string
      time:
        type: string
      ua:
        type: string
      url:
        type: string
    type: object
  models.Response:
    properties:
      code:
        default: 0
        example: 0
        format: int
        type: integer
      data: {}
      msg:
        default: ok
        example: ok
        type: string
    type: object
  models.ShortLinkData:
    properties:
      createTime:
        type: string
      createdBy:
        type: string
      description:
        type: string
      id:
        type: string
      isEnable:
        type: boolean
      updateTime:
        type: string
      url:
        type: string
    type: object
  models.ShortLinkDataAPIResponseData:
    properties:
      daily:
        items:
          $ref: '#/definitions/models.DailyStats'
        type: array
      histories:
        items:
          $ref: '#/definitions/models.RequestHistory'
        type: array
      osDist:
        additionalProperties:
          type: integer
        type: object
    type: object
  models.Tenant:
    properties:
      createdAt:
        type: string
      id:
        type: string
      isActive:
        type: boolean
      name:
        type: string
      slug:
        type: string
      updatedAt:
        type: string
    type: object
  models.TenantDomain:
    properties:
      createdAt:
        type: string
      domain:
        type: string
      id:
        type: string
      isDefault:
        type: boolean
      tenantId:
        type: string
    type: object
  models.UpdateIdLengthRequest:
    properties:
      idLength:
        type: integer
      idMaximumLength:
        type: integer
      idMinimumLength:
        type: integer
    required:
    - idLength
    - idMaximumLength
    - idMinimumLength
    type: object
  models.UpdateNotFoundConfigRequest:
    properties:
      mode:
        type: string
      value:
        type: string
    required:
    - mode
    - value
    type: object
  models.UpdateShortLinkAPIRequest:
    properties:
      description:
        type: string
      isEnable:
        type: boolean
      url:
        type: string
    required:
    - url
    type: object
  models.UpdateShortLinkAPIResponseData:
    properties:
      shortLink:
        $ref: '#/definitions/models.ShortLinkData'
    type: object
info:
  contact:
    email: m.mjw.ma@gmail.com
    name: MJ Ma
    url: https://www.linkedin.com/in/mj-profile/
  license:
    name: MIT
    url: https://github.com/jwma/jump-jump/blob/master/LICENSE
paths:
  /config:
    get:
      consumes:
      - application/json
      description: 获取系统配置信息
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.GetConfigAPIResponseData'
              type: object
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 获取系统配置信息
      tags:
      - 系统配置
  /config/id-length:
    patch:
      consumes:
      - application/json
      description: 更新短链接 ID 设置
      parameters:
      - description: 更新短链接 ID 设置请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.UpdateIdLengthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.GetConfigAPIResponseData'
              type: object
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 更新短链接 ID 设置
      tags:
      - 系统配置
  /config/short-link-404-handling:
    patch:
      consumes:
      - application/json
      description: 更新短链接 404 设置
      parameters:
      - description: 更新短链接 404 设置请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.UpdateNotFoundConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.GetConfigAPIResponseData'
              type: object
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 更新短链接 404 设置
      tags:
      - 系统配置
  /short-link/:
    get:
      consumes:
      - application/json
      description: 短链接列表
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页条数
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.ListShortLinksAPIResponseData'
              type: object
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 短链接列表
      tags:
      - 短链接
    post:
      consumes:
      - application/json
      description: 创建短链接
      parameters:
      - description: 创建短链接请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CreateShortLinkAPIRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.CreateShortLinkAPIResponseData'
              type: object
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 创建短链接
      tags:
      - 短链接
  /short-link/{id}:
    delete:
      consumes:
      - application/json
      description: 删除短链接
      parameters:
      - description: 短链接 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Response'
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 删除短链接
      tags:
      - 短链接
    get:
      consumes:
      - application/json
      description: 获取指定 ID 短链接详情
      parameters:
      - description: 短链接 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.GetShortLinkAPIResponseData'
              type: object
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 获取指定 ID 短链接
      tags:
      - 短链接
    patch:
      consumes:
      - application/json
      description: 更新短链接
      parameters:
      - description: 短链接 ID
        in: path
        name: id
        required: true
        type: string
      - description: 更新短链接请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.UpdateShortLinkAPIRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.UpdateShortLinkAPIResponseData'
              type: object
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 更新短链接
      tags:
      - 短链接
  /short-link/{id}/data:
    get:
      consumes:
      - application/json
      description: 可查询短链接某个日期范围内的访问数据
      parameters:
      - description: 短链接 ID
        in: path
        name: id
        required: true
        type: string
      - description: 开始日期 YYYY-mm-dd
        in: query
        name: startDate
        required: true
        type: string
      - description: 结束日期 YYYY-mm-dd
        in: query
        name: endDate
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.ShortLinkDataAPIResponseData'
              type: object
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 短链接访问数据
      tags:
      - 短链接
  /tenant/:
    get:
      consumes:
      - application/json
      description: 获取租户列表（仅管理员）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Tenant'
                  type: array
              type: object
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 租户列表
      tags:
      - 租户
    post:
      consumes:
      - application/json
      description: 创建租户（仅管理员）
      parameters:
      - description: 创建租户请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CreateTenantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.Tenant'
              type: object
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 创建租户
      tags:
      - 租户
  /tenant/{id}:
    get:
      consumes:
      - application/json
      description: 获取租户详情（仅管理员）
      parameters:
      - description: 租户 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.Tenant'
              type: object
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 获取租户详情
      tags:
      - 租户
  /tenant/{id}/domains:
    delete:
      consumes:
      - application/json
      description: 删除租户域名（仅管理员）
      parameters:
      - description: 租户 ID
        in: path
        name: id
        required: true
        type: string
      - description: 域名
        in: query
        name: domain
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.TenantDomain'
                  type: array
              type: object
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 删除域名
      tags:
      - 租户
    get:
      consumes:
      - application/json
      description: 获取租户域名列表（仅管理员）
      parameters:
      - description: 租户 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.TenantDomain'
                  type: array
              type: object
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 获取租户域名列表
      tags:
      - 租户
    post:
      consumes:
      - application/json
      description: 为租户添加域名（仅管理员）
      parameters:
      - description: 租户 ID
        in: path
        name: id
        required: true
        type: string
      - description: 添加域名请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.AddDomainRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.TenantDomain'
                  type: array
              type: object
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 添加域名
      tags:
      - 租户
  /user/change-password:
    post:
      consumes:
      - application/json
      description: 修改账号密码
      parameters:
      - description: 修改密码请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.ChangePasswordAPIRequest'
      produces:
      - application/json
      responses:
        "200":
