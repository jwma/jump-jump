definitions:
  models.AddDomainRequest:
    properties:
      domain:
        type: string
      isDefault:
        type: boolean
    required:
    - domain
    type: object
  models.AuthInfoResponseData:
    properties:
      tenants:
        items:
          $ref: '#/definitions/models.UserTenantEntry'
        type: array
      user:
        $ref: '#/definitions/models.AuthInfoUser'
    type: object
  models.AuthInfoUser:
    properties:
      id:
        type: string
      isSuper:
        type: boolean
      username:
        type: string
    type: object
  models.ChangePasswordAPIRequest:
    properties:
      newPassword:
        type: string
      password:
        type: string
    type: object
  models.CreateShortLinkAPIRequest:
    properties:
      description:
        type: string
      id:
        type: string
      idLength:
        type: integer
      isEnable:
        type: boolean
      url:
        type: string
    type: object
  models.CreateShortLinkAPIResponseData:
    properties:
      shortLink:
        $ref: '#/definitions/models.ShortLinkData'
    type: object
  models.CreateTenantRequest:
    properties:
      name:
        type: string
      slug:
        type: string
    required:
    - name
    - slug
    type: object
  models.CreateUserRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  models.DailyStats:
    properties:
      date:
        type: string
      pv:
        type: integer
      uv:
        type: integer
    type: object
  models.GetConfigAPIResponseData:
    properties:
      config: {}
    type: object
  models.GetShortLinkAPIResponseData:
    properties:
      shortLink:
        $ref: '#/definitions/models.ShortLinkData'
    type: object
  models.GetUserInfoAPIResponseData:
    properties:
      isSuper:
        type: boolean
      role:
        type: string
      username:
        type: string
    type: object
  models.InvitationData:
    properties:
      createdAt:
        type: string
      id:
        type: string
      inviterUsername:
        type: string
      status:
        type: string
      tenantId:
        type: string
      tenantName:
        type: string
    type: object
  models.InviteUserRequest:
    properties:
      username:
        type: string
    required:
    - username
    type: object
  models.ListShortLinksAPIResponseData:
    properties:
      shortLinks:
        items:
          $ref: '#/definitions/models.ShortLinkData'
        type: array
      total:
        type: integer
    type: object
  models.ListUsersResponseData:
    properties:
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/models.UserData'
        type: array
    type: object
  models.LoginAPIRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  models.LoginAPIResponseData:
    properties:
      token:
        type: string
    type: object
  models.RequestHistory:
    properties:
      id:
        type: string
      ip:
        type: string
      os:
        type: string
      shortLinkId:
        type: string
      tenantId:
        type: string
      time:
        type: string
      ua:
        type: string
      url:
        type: string
    type: object
  models.ResetPasswordRequest:
    properties:
      newPassword:
        type: string
    required:
    - newPassword
    type: object
  models.Response:
    properties:
      code:
        default: 0
        example: 0
        format: int
        type: integer
      data: {}
      msg:
        default: ok
        example: ok
        type: string
    type: object
  models.ShortLinkData:
    properties:
      createTime:
        type: string
      createdBy:
        type: string
      description:
        type: string
      id:
        type: string
      isEnable:
        type: boolean
      updateTime:
        type: string
      url:
        type: string
    type: object
  models.ShortLinkDataAPIResponseData:
    properties:
      daily:
        items:
          $ref: '#/definitions/models.DailyStats'
        type: array
      histories:
        items:
          $ref: '#/definitions/models.RequestHistory'
        type: array
      osDist:
        additionalProperties:
          type: integer
        type: object
    type: object
  models.Tenant:
    properties:
      createdAt:
        type: string
      id:
        type: string
      isActive:
        type: boolean
      name:
        type: string
      slug:
        type: string
      updatedAt:
        type: string
    type: object
  models.TenantDomain:
    properties:
      createdAt:
        type: string
      domain:
        type: string
      id:
        type: string
      isDefault:
        type: boolean
      tenantId:
        type: string
    type: object
  models.TenantInvitation:
    properties:
      createdAt:
        type: string
      id:
        type: string
      inviteeId:
        type: string
      inviterId:
        type: string
      status:
        type: string
      tenantId:
        type: string
    type: object
  models.TenantMemberData:
    properties:
      joinedAt:
        type: string
      role:
        type: string
      userId:
        type: string
      username:
        type: string
    type: object
  models.UpdateRoleRequest:
    properties:
      role:
        type: string
    required:
    - role
    type: object
  models.UpdateShortLinkAPIRequest:
    properties:
      description:
        type: string
      isEnable:
        type: boolean
      url:
        type: string
    required:
    - url
    type: object
  models.UpdateShortLinkAPIResponseData:
    properties:
      shortLink:
        $ref: '#/definitions/models.ShortLinkData'
    type: object
  models.UpdateTenantConfigRequest:
    properties:
      idLength:
        type: integer
      idMaximumLength:
        type: integer
      idMinimumLength:
        type: integer
      notFoundMode:
        type: string
      notFoundValue:
        type: string
    type: object
  models.UpdateTenantRequest:
    properties:
      name:
        type: string
      slug:
        type: string
    type: object
  models.UpdateTenantStatusRequest:
    properties:
      isActive:
        type: boolean
    required:
    - isActive
    type: object
  models.UpdateUserStatusRequest:
    properties:
      isActive:
        type: boolean
    required:
    - isActive
    type: object
  models.UserData:
    properties:
      createdAt:
        type: string
      id:
        type: string
      isActive:
        type: boolean
      isSuper:
        type: boolean
      updatedAt:
        type: string
      username:
        type: string
    type: object
  models.UserDetailData:
    properties:
      createdAt:
        type: string
      id:
        type: string
      isActive:
        type: boolean
      isSuper:
        type: boolean
      tenants:
        items:
          $ref: '#/definitions/models.UserTenantEntry'
        type: array
      updatedAt:
        type: string
      username:
        type: string
    type: object
  models.UserTenantEntry:
    properties:
      role:
        type: string
      tenantId:
        type: string
      tenantName:
        type: string
    type: object
