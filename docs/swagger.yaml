            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.GetUserInfoAPIResponseData'
              type: object
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 获取账号信息
      tags:
      - 账号
  /user/login:
    post:
      consumes:
      - application/json
      description: 账号密码登入
      parameters:
      - description: 登入请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.LoginAPIRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.LoginAPIResponseData'
              type: object
      summary: 账号登入
