paths:
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: 修改账号密码
      parameters:
      - description: 修改密码请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.ChangePasswordAPIRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Response'
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 修改账号密码
      tags:
      - 账号
  /auth/info:
    get:
      consumes:
      - application/json
      description: 获取当前用户信息及租户列表
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.AuthInfoResponseData'
              type: object
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 获取当前用户信息及租户列表
      tags:
      - 账号
  /auth/login:
    post:
      consumes:
      - application/json
      description: 账号密码登入
      parameters:
      - description: 登入请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.LoginAPIRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.LoginAPIResponseData'
              type: object
      summary: 账号登入
      tags:
      - 账号
  /invitations:
    get:
      consumes:
      - application/json
      description: 查看当前用户收到的所有待处理邀请
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.InvitationData'
                  type: array
              type: object
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 查看我的邀请
      tags:
      - 邀请
  /invitations/{id}/accept:
    post:
      consumes:
      - application/json
      description: 接受租户邀请
      parameters:
      - description: 邀请 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Response'
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 接受邀请
      tags:
      - 邀请
  /invitations/{id}/reject:
    post:
      consumes:
      - application/json
      description: 拒绝租户邀请
      parameters:
      - description: 邀请 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Response'
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 拒绝邀请
      tags:
      - 邀请
  /short-link/:
    get:
      consumes:
      - application/json
      description: 短链接列表
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页条数
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.ListShortLinksAPIResponseData'
              type: object
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 短链接列表
      tags:
      - 短链接
    post:
      consumes:
      - application/json
      description: 创建短链接
      parameters:
      - description: 创建短链接请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CreateShortLinkAPIRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.CreateShortLinkAPIResponseData'
              type: object
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 创建短链接
      tags:
      - 短链接
  /short-link/{id}:
    delete:
      consumes:
      - application/json
      description: 删除短链接
      parameters:
      - description: 短链接 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Response'
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 删除短链接
      tags:
      - 短链接
    get:
      consumes:
      - application/json
      description: 获取指定 ID 短链接详情
      parameters:
      - description: 短链接 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.GetShortLinkAPIResponseData'
              type: object
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 获取指定 ID 短链接
      tags:
      - 短链接
    patch:
      consumes:
      - application/json
      description: 更新短链接
      parameters:
      - description: 短链接 ID
        in: path
        name: id
        required: true
        type: string
      - description: 更新短链接请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.UpdateShortLinkAPIRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.UpdateShortLinkAPIResponseData'
              type: object
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 更新短链接
      tags:
      - 短链接
  /short-link/{id}/data:
    get:
      consumes:
      - application/json
      description: 可查询短链接某个日期范围内的访问数据
      parameters:
      - description: 短链接 ID
        in: path
        name: id
        required: true
        type: string
      - description: 开始日期 YYYY-mm-dd
        in: query
        name: startDate
        required: true
        type: string
      - description: 结束日期 YYYY-mm-dd
        in: query
        name: endDate
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/models.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.ShortLinkDataAPIResponseData'
              type: object
        "401":
          description: Unauthorized
      security:
      - ApiKeyAuth: []
      summary: 短链接访问数据
      tags:
      - 短链接
