name: CI

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

jobs:
  backend:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: jumpjump_test
          POSTGRES_USER: jumpjump
          POSTGRES_PASSWORD: jumpjump
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://jumpjump:jumpjump@127.0.0.1:5432/jumpjump_test?sslmode=disable
      REDIS_HOST: 127.0.0.1
      REDIS_DB: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go mod download
      - run: go test ./...
      - run: go build -o apiserver ./cmd/apiserver
      - run: go build -o landingserver ./cmd/landingserver
      - run: go build -o createsuperuser ./cmd/createsuperuser

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - run: cd web-ui && npm ci
      - run: cd web-ui && npm run lint
      - run: cd web-ui && npm run build
